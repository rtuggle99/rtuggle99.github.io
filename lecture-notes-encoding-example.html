<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lecture Notes Encoding Example</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,700;1,400&family=Noto+Sans+Mono:wght@400;700&family=Noto+Sans+Symbols+2&display=swap" rel="stylesheet">
<style>
  /* Same paper-blue system as the Turing Machine Explorer, in light mode only like the other sites: one panel per job, the machine at the center. */
  :root{
    --paper:#eaf4fb; --panel:#ffffff; --panel-2:#f5fafd; --ink:#16324f; --ink-soft:#3d5a75; --rule:#a9cbe4; --muted:#8fb0c8;
    --info:#2f6690; --info-soft:#d7ebf7; --info-hover:#255277; --path:#7fb0d8;
    --good:#2f7a4f; --good-soft:#dcf0e2; --danger:#a8384a; --danger-soft:#f6dde1; --warn:#946312; --warn-soft:#f8ecd2;
    --region:#f4f9fd; --region-on:#e4f1fa; --on-info:#ffffff;
    --mono:"Courier New", "Noto Sans Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif:Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    --symbols:'Noto Sans', 'Noto Sans Symbols 2', 'DejaVu Sans', sans-serif;
    --cell:38px;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.5;}
  .page{max-width:1440px;margin:0 auto;padding-block:24px 70px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));}
  header h1{font-weight:700;font-size:1.65rem;letter-spacing:0.01em;margin:0;border-bottom:3px solid var(--ink);padding-bottom:9px;text-wrap:balance;}
  header p{color:var(--ink-soft);font-style:italic;font-size:0.92rem;margin:12px 0 18px;max-width:78ch;}
  .defn{font-size:1.05rem;margin:16px 0 20px;max-width:70ch;}
  .defn p{margin:0 0 6px;line-height:1.6;}
  .defn sub.tt{font-family:var(--mono);font-size:0.72em;}
  .s{font-family:var(--symbols);font-weight:700;font-size:1.08em;}
  .panels{display:flex;flex-direction:column;gap:20px;}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:16px 18px 18px;min-width:0;}
  .panel h2{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-soft);margin:0 0 10px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .spacer{flex:1;}
  .note{font-size:0.82rem;color:var(--ink-soft);}
  .btn{font-family:var(--mono);font-size:0.86rem;padding:7px 13px;border-radius:3px;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink);cursor:pointer;white-space:nowrap;line-height:1.2;}
  .btn:hover{background:var(--info-soft);border-color:var(--info);}
  .btn.primary{background:var(--info);border-color:var(--info);color:var(--on-info);}
  .btn.primary:hover{background:var(--info-hover);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;}
  .btn.small{padding:5px 10px;font-size:0.8rem;}
  .btn.icon{min-width:38px;padding:7px 9px;text-align:center;}
  .btn:focus-visible, .text-in:focus-visible, select:focus-visible, .stage:focus-visible{outline:2px solid var(--info);outline-offset:2px;}
  .text-in{-webkit-appearance:none;appearance:none;font-family:var(--mono);font-size:1rem;background:var(--panel-2);border:1.5px solid var(--ink);border-radius:3px;padding:7px 10px;color:var(--ink);min-width:0;}
  .text-in.bad{border-color:var(--danger);background:var(--danger-soft);}
  .text-in:disabled{opacity:0.75;}
  #encIn{flex:1 1 380px;letter-spacing:0.04em;resize:none;overflow:hidden;line-height:1.45;word-break:break-all;overflow-wrap:anywhere;white-space:pre-wrap;}
  #encIn[readonly]{opacity:0.75;cursor:default;}
  /* locked look, same as the Turing Machine Explorer: a gray shade over the input and a lock */
  #lockZone{position:relative;}
  #inputPanel.is-locked #lockZone::before{content:'';position:absolute;inset:-16px -18px -6px -18px;background:rgba(90,100,118,0.13);border-radius:3px 3px 0 0;pointer-events:none;z-index:1;}
  @media (max-width:600px){ #inputPanel.is-locked #lockZone::before{inset:-14px -12px -6px -12px;} }
  .in-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .in-head h2{margin-bottom:10px;}
  .lock-icon{display:none;font-size:15px;opacity:0.85;margin-bottom:10px;}
  #inputPanel.is-locked .lock-icon{display:inline;}
  .enc-label{font-size:1.05rem;white-space:nowrap;align-self:flex-start;padding-top:7px;}
  .msg{font-size:0.86rem;margin:8px 0 0;}
  .msg:empty{display:none;}
  .msg.err{color:var(--danger);}
  .msg.ok{color:var(--ink-soft);}

  /* ---------- tape ---------- */
  .tape-wrap{position:relative;overflow:hidden;height:calc(var(--cell) + 64px);background:var(--panel-2);border:1px solid var(--rule);border-radius:3px;margin-top:4px;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;}
  .tape-wrap.panning{cursor:grabbing;}
  .tape-strip{position:absolute;left:0;top:0;height:100%;will-change:transform;}
  .cells{position:absolute;left:12px;top:20px;height:var(--cell);}
  .cell{position:absolute;top:0;width:var(--cell);height:var(--cell);border:1.5px solid var(--ink);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:1.12rem;font-weight:700;box-sizing:border-box;}
  .cell.left-end{border-left-width:4px;}
  .cell .ix{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:0.6rem;color:var(--muted);font-weight:400;font-family:var(--mono);}
  .cell.blank{color:var(--muted);font-weight:400;font-family:var(--symbols);}
  .cell sup{font-family:var(--symbols);font-size:0.62rem;font-weight:700;margin-left:1px;line-height:0;position:relative;top:-0.5em;}
  .mA, .mB{color:var(--info);} .mT{color:var(--muted);} .mD{color:var(--good);} .mE{color:var(--ink-soft);}
  .cell.flash{animation:flash 0.55s ease-out;}
  @keyframes flash{0%{background:var(--info-soft);box-shadow:inset 0 0 0 3px var(--info);}100%{background:var(--panel);box-shadow:inset 0 0 0 0 var(--info);}}
  .dt{position:relative;display:inline-block;}
  .dt::after{content:'';position:absolute;left:50%;top:-0.08em;width:0.2em;height:0.2em;margin-left:-0.1em;border-radius:50%;background:currentColor;}
  .head{position:absolute;top:calc(20px + var(--cell) + 2px);left:12px;width:var(--cell);display:flex;flex-direction:column;align-items:center;pointer-events:none;}
  .head .tri{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:9px solid var(--ink);}
  .head .box{margin-top:-1px;padding:0 8px 1px;line-height:1.5;border:2px solid var(--ink);border-radius:3px;background:var(--panel);font-style:italic;font-size:0.92rem;white-space:nowrap;}
  .head .box sub{font-style:normal;font-size:0.7em;line-height:0;}
  .head .box .dd{font-style:normal;font-family:var(--mono);font-size:0.78em;color:var(--info);margin-left:4px;}
  .head.accept .tri{border-bottom-color:var(--good);} .head.accept .box{border-color:var(--good);background:var(--good-soft);color:var(--good);}
  .head.reject .tri{border-bottom-color:var(--danger);} .head.reject .box{border-color:var(--danger);background:var(--danger-soft);color:var(--danger);}
  .bands{position:absolute;left:12px;top:calc(20px + var(--cell) + 46px);height:22px;}
  .band{position:absolute;top:0;height:22px;border-top:2px solid var(--rule);font-size:0.72rem;color:var(--ink-soft);text-align:center;padding-top:1px;white-space:nowrap;overflow:hidden;}
  .band i{font-family:var(--serif);}
  .tape-wrap.no-motion .head{transition:none;}

  /* ---------- player ---------- */
  /* one control bar for both views */
  .player{background:var(--panel);border:1px solid var(--rule);border-radius:3px;padding:10px 14px;justify-content:center;}
  @media (max-width:999px){
    .player{position:sticky;bottom:max(8px, env(safe-area-inset-bottom, 0px));z-index:5;box-shadow:0 2px 10px rgba(22,50,79,0.16);}
  }
  .scrub{flex:1 1 160px;accent-color:var(--info);min-width:120px;}
  .stepcount{font-family:var(--mono);font-size:0.8rem;color:var(--ink-soft);white-space:nowrap;min-width:15ch;text-align:right;font-variant-numeric:tabular-nums;}
  .verdict{font-family:var(--mono);font-size:0.8rem;font-weight:700;padding:5px 10px;border-radius:3px;white-space:nowrap;}
  .verdict.accept{background:var(--good-soft);color:var(--good);}
  .verdict.reject{background:var(--danger-soft);color:var(--danger);}
  .narr{margin-top:12px;background:var(--info-soft);border-left:3px solid var(--info);border-radius:0 3px 3px 0;padding:9px 13px;min-height:3.4em;}
  .narr .ctx{font-size:0.95rem;}
  .narr .doing{font-size:0.84rem;color:var(--ink-soft);}
  .narr.accept{background:var(--good-soft);border-left-color:var(--good);}
  .narr.reject{background:var(--danger-soft);border-left-color:var(--danger);}
  .narr.idle{background:var(--panel-2);border-left-color:var(--rule);}
  .q{font-style:italic;} .q sub{font-style:normal;font-size:0.72em;}

  /* ---------- run layout ---------- */
  .algo-grid{display:flex;flex-direction:column;gap:18px;}
  .algo-grid .graph-box{max-width:520px;}
  /* wide screens: the machine on the left, the graph and the algorithm beside it; narrow screens: stacked, graph first */
  .work-grid{display:flex;flex-direction:column;gap:20px;}
  @media (min-width:1000px){
    .work-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,400px);align-items:start;}
    #runPanel{grid-column:1;grid-row:1;}
    #algoPanel{grid-column:2;grid-row:1;position:sticky;top:max(12px, env(safe-area-inset-top, 0px));max-height:calc(100vh - 24px);overflow:auto;}
    .algo-grid .graph-box{max-width:none;}
  }
  .side{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .sub-h{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-soft);margin:0 0 6px;}
  .diag-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 8px;}
  .diag-wrap{border:1px solid var(--rule);border-radius:3px;background:var(--panel);overflow:hidden;}
  .diag-wrap svg.tm{width:100%;height:auto;}
  .legend{font-size:0.8rem;color:var(--ink-soft);margin-top:8px;line-height:1.55;}
  .legend b{font-family:var(--symbols);color:var(--ink);}
  .legend details summary{cursor:pointer;color:var(--info);}
  .legend dl{display:grid;grid-template-columns:4.2em 1fr;gap:2px 10px;margin:8px 0 0;}
  .legend dt{font-family:var(--symbols);font-weight:700;color:var(--ink);}
  .legend dd{margin:0;}

  /* ---------- diagram (same look as the Turing Machine Explorer) ---------- */
  svg.tm{display:block;}
  svg.tm .region rect{fill:none;stroke:var(--rule);stroke-width:1.2;}
  svg.tm .region.on rect{stroke:var(--info);stroke-width:2.4;}
  svg.tm .rg-title{font-family:var(--serif);font-weight:700;font-size:17px;fill:var(--ink-soft);letter-spacing:0.02em;}
  svg.tm .region.on .rg-title{fill:var(--info);}
  svg.tm .ep{fill:none;stroke:var(--ink-soft);stroke-width:1.4;opacity:0.8;}
  svg.tm .edge.used .ep{opacity:1;}
  svg.tm .ah, svg.tm .ahm{fill:var(--ink-soft);}
  svg.tm .ahm-ink{fill:var(--ink);}
  svg.tm .ahm-used{fill:var(--info);}
  svg.tm .edge.used .ep{stroke:var(--info);stroke-width:3;}
  svg.tm .edge.used .ah{fill:var(--info);}
  svg.tm .el{font-family:var(--symbols);font-size:12.5px;fill:var(--ink);text-anchor:middle;}
  svg.tm .el .ts{font-weight:700;}
  svg.tm .el.used{fill:var(--info);font-weight:700;}
  svg.tm .edot{fill:var(--ink);} svg.tm .edot.used{fill:var(--info);}
  svg.tm .lbl{opacity:0.3;}
  svg.tm .lbl.used{opacity:1;}
  svg.tm .elb{fill:none;}
  svg.tm .lbl.used .elb{fill:var(--panel);fill-opacity:0.94;stroke:var(--info);stroke-width:1;}
  svg.tm .sc{fill:var(--panel);stroke:var(--ink);stroke-width:2.2;}
  svg.tm .si{fill:none;stroke:var(--good);stroke-width:1.6;}
  svg.tm .st-accept .sc{fill:#f3faf5;stroke:var(--good);}
  svg.tm .st-reject .sc{fill:#fcf3f5;stroke:var(--danger);}
  svg.tm .sl{font-family:var(--serif);font-style:italic;font-size:17px;fill:var(--ink);text-anchor:middle;pointer-events:none;}
  svg.tm .sl .sub{font-style:normal;font-size:12px;}
  svg.tm .start{stroke:var(--ink);stroke-width:2.2;}
  svg.tm .st.cur .sc{fill:var(--info-soft);stroke:var(--info);stroke-width:3.4;}
  svg.tm .st.halt-acc .sc{fill:var(--good-soft);stroke:var(--good);stroke-width:3.4;}
  svg.tm .st.halt-rej .sc{fill:var(--danger-soft);stroke:var(--danger);stroke-width:3.4;}
  svg.tm .st.fail .sc{stroke:var(--danger);stroke-width:3.4;stroke-dasharray:5 3;}
  svg.tm .token{fill:var(--info);stroke:#fff;stroke-width:2;pointer-events:none;}

  /* ---------- stage list ---------- */
  .stages{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .stage{display:grid;grid-template-columns:1.7em 1fr;gap:6px;align-items:start;padding:6px 8px;border-radius:3px;border-left:3px solid transparent;cursor:pointer;font-size:0.88rem;}
  .stage:hover{background:var(--panel-2);}
  .stage .mark{font-family:var(--symbols);font-weight:700;color:var(--muted);text-align:center;}
  .stage.active{background:var(--info-soft);border-left-color:var(--info);}
  .stage.active .mark{color:var(--info);}
  .stage.done .mark{color:var(--good);}
  .stage.failed{background:var(--danger-soft);border-left-color:var(--danger);}
  .stage.failed .mark{color:var(--danger);}
  .stage.locked{cursor:default;}

  /* ---------- graph ---------- */
  .graph-box{border:1px solid var(--rule);border-radius:3px;background:var(--panel);}
  svg.graph{display:block;width:100%;height:auto;}
  svg.graph .gv circle{fill:var(--panel);stroke:var(--ink);stroke-width:2;transition:fill 0.15s, stroke 0.15s;}
  svg.graph .gv text{font-family:var(--serif);font-size:15px;fill:var(--ink);text-anchor:middle;}
  svg.graph .gv.va circle{fill:var(--info-soft);stroke:var(--info);stroke-width:3.4;}
  svg.graph .gv.vb circle{stroke:var(--info);stroke-width:3;stroke-dasharray:5 3;}
  svg.graph .gv.vused circle{fill:var(--good-soft);stroke:var(--good);}
  svg.graph .gv.vtried circle{stroke:var(--muted);}
  svg.graph .gv.vbad circle{fill:var(--danger-soft);stroke:var(--danger);stroke-width:3.4;}
  svg.graph .gv.ghost circle{stroke-dasharray:4 3;stroke:var(--muted);fill:var(--panel-2);}
  svg.graph .gv.ghost text{fill:var(--ink-soft);}
  svg.graph .gv.ghost.vbad circle{stroke:var(--danger);fill:var(--danger-soft);}
  svg.graph .ghost-cap{font-family:var(--serif);font-style:italic;font-size:11px;fill:var(--ink-soft);text-anchor:middle;}
  svg.graph .ge{fill:none;stroke:var(--ink-soft);stroke-width:1.6;}
  svg.graph .ge.etry{stroke:var(--info);stroke-width:2.6;}
  svg.graph .ge.etried{stroke:var(--muted);stroke-dasharray:2 3;}
  svg.graph .ge.ebad{stroke:var(--danger);stroke-width:2.6;stroke-dasharray:6 4;}
  svg.graph .ga{fill:var(--ink-soft);}
  svg.graph .ga.etry{fill:var(--info);} svg.graph .ga.ebad{fill:var(--danger);} svg.graph .ga.etried{fill:var(--muted);}
  svg.graph .hl{fill:none;stroke:var(--path);stroke-width:9;stroke-linecap:round;opacity:0.42;}
  svg.graph .pseg{fill:none;stroke-width:3.6;stroke-linecap:round;}
  svg.graph .pseg.pending{stroke:var(--path);stroke-width:2.6;stroke-dasharray:6 5;}
  svg.graph .pseg.active{stroke:var(--info);}
  svg.graph .pseg.active.missing{stroke-dasharray:7 5;}
  svg.graph .pseg.ok{stroke:var(--good);}
  svg.graph .pseg.bad{stroke:var(--danger);stroke-dasharray:7 5;}
  svg.graph .pa.pending{fill:var(--path);} svg.graph .pa.active{fill:var(--info);} svg.graph .pa.ok{fill:var(--good);} svg.graph .pa.bad{fill:var(--danger);}
  svg.graph .ord{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--path);text-anchor:middle;}
  svg.graph .ord.on{fill:var(--info);}
  svg.graph .ord.done{fill:var(--good);}
  svg.graph .ord-bg{fill:var(--panel);stroke:var(--path);stroke-width:1;}
  svg.graph .empty{font-family:var(--serif);font-style:italic;font-size:14px;fill:var(--ink-soft);text-anchor:middle;}
  .g-legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:0.78rem;color:var(--ink-soft);padding:8px 10px;border-top:1px solid var(--rule);}
  .g-legend span{display:inline-flex;align-items:center;gap:5px;}
  .sw{display:inline-block;width:20px;height:0;border-top:3px solid;}
  .sw.pend{border-color:var(--path);border-top-width:8px;opacity:0.45;border-radius:4px;} .sw.act{border-color:var(--info);} .sw.ok{border-color:var(--good);} .sw.bad{border-color:var(--danger);border-top-style:dashed;}
  footer{margin-top:36px;color:var(--ink-soft);font-size:0.78rem;line-height:1.6;border-top:1px solid var(--rule);padding-top:14px;max-width:90ch;}
  footer p{margin:0 0 6px;}
  @media (max-width:600px){
    :root{--cell:34px;}
    header h1{font-size:1.4rem;}
    .panel{padding:14px 12px 16px;}
    .stepcount{min-width:0;}
  }
  @media (prefers-reduced-motion: reduce){ .head{transition:none;} .cell.flash{animation:none;} }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Lecture Notes Encoding Example</h1>
  </header>
  <div class="defn">
    <p><i>S</i><sub class="tt">path</sub>&nbsp;=&nbsp;{&#x27E8;<i>G</i>,&#8202;<i>P</i>&#x27E9;&nbsp;|&nbsp;<i>G</i> is a directed graph and <i>P</i> is a path in <i>G</i> that visits every vertex exactly&nbsp;once}</p>
    <p>Σ&nbsp;=&nbsp;{&#8202;<span class="s">0</span>, <span class="s">1</span>, <span class="s">2</span>, <span class="s">3</span>, <span class="s">4</span>, <span class="s">5</span>, <span class="s">6</span>, <span class="s">7</span>, <span class="s">8</span>, <span class="s">9</span>, <span class="s">(</span>, <span class="s">)</span>, <span class="s">#</span>, <span class="s">,</span>&#8202;}</p>
  </div>

  <main class="panels">
    <section class="panel" id="inputPanel" aria-labelledby="inH">
      <div id="lockZone">
        <div class="in-head"><h2 id="inH">Your input</h2><span class="lock-icon" aria-label="Locked" title="Locked in. Press “Edit input” to change it.">🔒</span></div>
        <div class="row">
          <label class="enc-label" for="encIn">⟨<i>G</i>,<i>P</i>⟩ =</label>
          <textarea class="text-in" id="encIn" rows="1" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="encMsg"></textarea>
        </div>
        <p class="msg ok" id="encMsg"></p>
      </div>
      <div class="row" style="margin-top:6px;justify-content:flex-end;">
        <span class="note" id="lockNote"></span>
        <button class="btn primary" id="lockBtn" type="button">Lock in</button>
        <button class="btn primary" id="editBtn" type="button" hidden>Edit input</button>
      </div>
    </section>

    <div class="work-grid">
    <section class="panel" id="algoPanel" aria-labelledby="algoH">
      <h2 id="algoH">High level</h2>
      <div class="algo-grid">
        <div style="min-width:0;">
          <div class="graph-box">
            <svg class="graph" id="graphSvg" viewBox="0 0 380 380" role="img" aria-label="The graph G with the path P drawn on it"></svg>
            <div class="g-legend">
              <span><span class="sw pend"></span>edge of P, not checked yet</span>
              <span><span class="sw act"></span>edge of P being checked</span>
              <span><span class="sw ok"></span>found in G</span>
              <span><span class="sw bad"></span>not in G</span>
            </div>
          </div>
        </div>
        <div style="min-width:0;">
          <ol class="stages" id="stages"></ol>
        </div>
      </div>
    </section>

    <section class="panel" id="runPanel" aria-labelledby="runH">
      <h2 id="runH">Low level</h2>
      <div class="tape-wrap" id="tapeWrap" title="Drag to scroll the tape">
        <div class="tape-strip" id="tapeStrip">
          <div class="cells" id="cells"></div>
          <div class="head" id="head"><div class="tri"></div><div class="box" id="headBox"></div></div>
        </div>
      </div>
      <div class="diag-tools">
        <span class="note" id="sizeNote"></span>
        <span class="spacer"></span>
      </div>
      <div class="diag-wrap" id="diagWrap"></div>
    </section>
    </div>

      <button class="btn" id="resetBtn" title="Start over (R)">⏮ Start over</button>
      <button class="btn primary" id="playBtn" title="Play or pause (Space)" style="min-width:96px;">▶ Play</button>
      <button class="btn" id="endBtn" title="Go to the end">Go to the end ⏭</button>

<script>
// Builds a real single-tape Turing machine that decides
//   S_path = { <G,P> : G is a directed graph and P is a path in G visiting every vertex exactly once }
// over Sigma = {0..9, (, ), #, ,}, encoded as (V)(E)#(P).
// Every state and transition below is an actual TM transition; the page only groups the ten
// "carrying digit d" copies of a state into one drawn node.
(function(root){
'use strict';
const DIG = '0123456789'.split('');
const DOT = DIG.map(d=>d+"'");               // crossed-off digit
const MK = ['', 'A', 'B', 'T', 'D'];         // delimiter marks: none, A, B, tried, done
const DELIMS = [];
['(', ','].forEach(c=>MK.forEach(m=>DELIMS.push(c+m)));
const ESTART = '(E', BLANK = '_';
const CUR = '(C';                             // the edge being compared with later ones, while its end vertex is compared
const ALL = [...DIG, ...DOT, ...DELIMS, ')', '#', ESTART, CUR, BLANK];
const dl = m => ['('+m, ','+m];               // both delimiter kinds carrying mark m
const A_ = dl('A'), B_ = dl('B'), T_ = dl('T'), D_ = dl('D'), PLAIN = dl('');
const setMark = m => s => s[0]+m;
const undot = s => s[0];

function build(){
  const states = {}, delta = {}, order = [];
  let region = null;
  function S(id, label, desc){
    if(states[id]) throw new Error('dup state '+id);
    states[id] = {id, region, label, desc, fam:null, d:null};
    delta[id] = {}; order.push(id); return id;
  }
  function SF(fam, label, desc){
    DIG.forEach(d=>{ const id = fam+'_'+d; states[id] = {id, region, label, desc, fam, d}; delta[id] = {}; order.push(id); });
    return fam;
  }
  function T(from, syms, write, move, to, rule){
    for(const s of syms){
      if(delta[from][s]) throw new Error(`dup transition ${from} on ${s}`);
      const w = write==null ? s : typeof write==='function' ? write(s) : write;
      delta[from][s] = {to, write:w, move, rule};
    }
  }
  function Tother(from, move, to, rule){
    T(from, ALL.filter(s=>!delta[from][s]), null, move, to, rule || ('other → '+move));
  }
  const famIds = fam => DIG.map(d=>fam+'_'+d);

  // ---------- comparison routine: is the number after the A-marked delimiter equal to the one after the B-marked delimiter?
  // dirAB: which way B lies from A. exits.{match,mismatch}: null = reject, or {write, move, to, rule} applied on the B delimiter.
  function compare(p, dirAB, exits){
    const rev = dirAB==='L' ? 'R' : 'L';
    const toA = S(p+'toA', 'go to A', 'Walking back to the A-marked number.');
    const readA = S(p+'readA', 'next digit of A', 'Looking for the first digit of A that is not crossed off yet.');
    SF(p+'carry', 'carry d', 'Remembering digit d in the state while walking to the B-marked number.');
    SF(p+'skipB', 'match d in B', 'Looking for the first digit of B that is not crossed off, to compare with d.');
    const checkB = S(p+'checkB', 'A used up', 'A has no digits left. Going to B to see whether B is used up too.');
    const endB = S(p+'endB', 'B used up?', 'Checking that B has no digits left either.');
    T(toA, A_, null, 'R', readA, 'δᴬ → R'); Tother(toA, rev, toA);
    T(readA, DOT, null, 'R', readA, 'ḋ → R');
    DIG.forEach(d=>T(readA, [d], d+"'", dirAB, p+'carry_'+d, 'd → ḋ, '+dirAB));
    T(readA, B_, null, 'R', endB, 'δᴮ → R');              // A ended right where B starts
    T(readA, [...DELIMS.filter(s=>!B_.includes(s)), ')'], null, dirAB, checkB, 'δ ⟦)⟧ → '+dirAB);
    DIG.forEach(d=>{
      const c = p+'carry_'+d, k = p+'skipB_'+d;
      T(c, B_, null, 'R', k, 'δᴮ → R'); Tother(c, dirAB, c);
      T(k, DOT, null, 'R', k, 'ḋ → R');
      T(k, [d], d+"'", rev, toA, 'd → ḋ, '+rev);
    });
    T(checkB, B_, null, 'R', endB, 'δᴮ → R'); Tother(checkB, dirAB, checkB);
    T(endB, DOT, null, 'R', endB, 'ḋ → R');
    function cleanup(tag, exit){
      const c1 = S(p+tag+'1', 'uncross B', 'Un-crossing B’s digits on the way back to its delimiter.');
      const c2 = S(p+tag+'2', 'go to A', 'Walking to A to un-cross its digits.');
      const c3 = S(p+tag+'3', 'uncross A', 'Un-crossing A’s digits.');
      const c4 = S(p+tag+'4', 'back to B', 'Walking back to the B-marked delimiter.');
      T(c1, DOT, undot, 'L', c1, 'ḋ → d, L'); T(c1, DIG, null, 'L', c1, 'd → L');
      T(c1, B_, null, rev, c2, 'δᴮ → '+rev);
      T(c2, A_, null, 'R', c3, 'δᴬ → R'); Tother(c2, rev, c2);
      T(c3, DOT, undot, 'R', c3, 'ḋ → d, R');
      T(c3, B_, exit.write, exit.move, exit.to, exit.rule);  // B starts right after A
      Tother(c3, dirAB, c4, 'other → '+dirAB);
      T(c4, B_, exit.write, exit.move, exit.to, exit.rule); Tother(c4, dirAB, c4);

    }
    const mis = exits.mismatch ? cleanup('mis', exits.mismatch) : null;
    const mat = exits.match ? cleanup('mat', exits.match) : null;
    const nonDig = [...DELIMS, ')'];
    if(mis){
      DIG.forEach(d=>{ const k = p+'skipB_'+d;
        T(k, DIG.filter(e=>e!==d), null, 'L', mis, 'e ≠ d → L'); T(k, nonDig, null, 'L', mis, 'δ ⟦)⟧ → L'); });

    }

    return toA;
  }

  // ======================= Stage 1: format =======================
  region = 1;
  const f0 = S('f0', 'start', 'Reading the opening ( of V.');
  function num(ctx, name){ // two states recognizing a nonempty string of digits
    return {
      start: S(ctx+'n', name, `Expecting a ${name}.`),
      dig: S(ctx+'d', 'in number', 'Reading the rest of a number.')

  }
  const nV = num('fV', 'vertex label'), nA = num('fA', 'edge start'), nB = num('fB', 'edge end'), nP = num('fP', 'path vertex');
  const fEo = S('fEo', 'E opens', 'Expecting the ( that opens E.');
  const fE1 = S('fE1', 'first edge?', 'Expecting an edge, or ) if E is empty.');
  const fEaft = S('fEaft', 'after edge', 'Expecting , before another edge, or ) to end E.');
  const fEnx = S('fEnx', 'next edge', 'Expecting the ( of the next edge.');
  const fH = S('fH', 'expect #', 'Expecting the # between ⟨G⟩ and ⟨P⟩.');
  const fPo = S('fPo', 'P opens', 'Expecting the ( that opens P.');
  const fEnd = S('fEnd', 'end?', 'Checking that nothing follows P.');

  T(fEnx, ['('], null, 'R', nA.start, '⟦(⟧ → R');
  T(fH, ['#'], null, 'R', fPo, '⟦#⟧ → R');
  T(fPo, ['('], null, 'R', nP.start, '⟦(⟧ → R');
  wireNum(nP, {',':nP.start, ')':fEnd});
  // stage 2 begins here
  // ======================= Stage 2: vertices distinct =======================
  region = 2;
  const s2goE = S('s2goE', 'back to E', 'Walking left to the start of E.');
  const s2goV = S('s2goV', 'to V start', 'Walking left to the first vertex of V.');
  const s2findJ = S('s2findJ', 'next later vertex', 'Finding the next vertex after the A-marked one to compare against it.');
  const s2resetT = S('s2resetT', 'clear tried', 'Done comparing this vertex: clearing the T marks and marking it D.');
  const s2findI = S('s2findI', 'next vertex', 'Finding the next vertex that hasn’t been checked yet.');
  const s2clr = S('s2clr', 'clear marks', 'Every vertex is distinct. Clearing the D marks from V.');
  T(fEnd, [BLANK], null, 'L', s2goE, '⟦⊔⟧ → L');
  T(s2goE, [ESTART], null, 'L', s2goV, '⟦(ᴱ⟧ → L'); Tother(s2goE, 'L', s2goE);
  T(s2goV, ['('], '(A', 'R', s2findJ, '⟦(⟧ → ⟦(⟧ᴬ, R'); Tother(s2goV, 'L', s2goV);
  const c2 = compare('c2', 'R', {match:null, mismatch:{write:setMark('T'), move:'R', to:s2findJ, rule:'δᴮ → δᵀ, R'}});
  T(s2findJ, DIG, null, 'R', s2findJ, 'd → R'); T(s2findJ, [',T'], null, 'R', s2findJ, '⟦,⟧ᵀ → R');
  T(s2findJ, [','], ',B', 'L', c2, '⟦,⟧ → ⟦,⟧ᴮ, L'); T(s2findJ, [')'], null, 'L', s2resetT, '⟦)⟧ → L');
  T(s2resetT, [',T'], ',', 'L', s2resetT, '⟦,⟧ᵀ → ⟦,⟧, L'); T(s2resetT, DIG, null, 'L', s2resetT, 'd → L');
  T(s2resetT, A_, setMark('D'), 'R', s2findI, 'δᴬ → δᴰ, R');
  T(s2findI, DIG, null, 'R', s2findI, 'd → R'); T(s2findI, [','], ',A', 'R', s2findJ, '⟦,⟧ → ⟦,⟧ᴬ, R');
  T(s2findI, [')'], null, 'L', s2clr, '⟦)⟧ → L');
  // ======================= Stage 3: edge endpoints are vertices =======================
  region = 3;
  const s3goE = S('s3goE', 'to E', 'Walking right to the start of E.');
  const s3findX = S('s3findX', 'next to look up', 'Finding the next edge endpoint, or vertex of P, that hasn’t been looked up in V yet.');
  const s3peek = S('s3peek', 'endpoint?', 'Is this comma followed by a number (an edge’s end) or by ( (between edges)?');
  const s3markC = S('s3markC', 'mark it A', 'Marking the comma before this edge’s end vertex with A.');
  const s3toE = S('s3toE', 'back to E', 'Walking left past E.');
  const s3toV = S('s3toV', 'to V start', 'Walking left to the first vertex of V.');
  const s3cand = S('s3cand', 'next candidate', 'This vertex didn’t match. Trying the next vertex of V.');
  const s3rt = S('s3rt', 'clear tried', 'Found a match. Clearing the T marks in V.');
  const s3toA = S('s3toA', 'mark done', 'Walking back to the endpoint to mark it D.');
  const e2findI = S('e2findI', 'next edge', 'Finding the next edge that hasn’t been compared with the edges after it. It gets an A mark.');
  const e2findJ = S('e2findJ', 'next later edge', 'Finding the next edge after the A-marked one to compare it with.');
  const e2commaJ = S('e2commaJ', 'to its end', 'The two edges start at the same vertex. Marking the later edge’s end vertex B.');
  const e2toI = S('e2toI', 'back to A edge', 'Walking back to the A-marked edge, which becomes (ᶜ while its end vertex is compared.');
  const e2commaI = S('e2commaI', 'mark its end', 'Marking the A-marked edge’s end vertex A.');
  const e2backI = S('e2backI', 'restore A', 'The end vertices differ. Putting the A mark back on the first edge.');
  const e2resetT = S('e2resetT', 'clear tried', 'No later edge repeats this one. Clearing the T marks and marking it D.');
  const e2clr = S('e2clr', 'clear marks', 'No edge is listed twice. Clearing the D marks from E.');
  const s3clr = S('s3clr', 'clear marks', 'Every edge endpoint and every vertex of P is in V. Clearing the D marks from E and P.');
  T(s2clr, [',D'], ',', 'L', s2clr, '⟦,⟧ᴰ → ⟦,⟧, L'); T(s2clr, DIG, null, 'L', s2clr, 'd → L');
  T(s2clr, ['(D'], '(', 'R', s3goE, '⟦(⟧ᴰ → ⟦(⟧, R');
  T(s3goE, [ESTART], null, 'R', s3findX, '⟦(ᴱ⟧ → R'); Tother(s3goE, 'R', s3goE);
  T(s3findX, [...DIG, ')', '(D', ',D', '#'], null, 'R', s3findX, 'd ⟦)⟧ δᴰ ⟦#⟧ → R');
  T(s3findX, ['('], '(A', 'L', s3toE, '⟦(⟧ → ⟦(⟧ᴬ, L');
  T(s3findX, [','], null, 'R', s3peek, '⟦,⟧ → R');
  T(s3findX, [BLANK], null, 'L', s3clr, '⟦⊔⟧ → L');
  T(s3peek, DIG, null, 'L', s3markC, 'd → L');
  T(s3peek, ['('], '(A', 'L', s3toE, '⟦(⟧ → ⟦(⟧ᴬ, L');
  T(s3markC, [','], ',A', 'L', s3toE, '⟦,⟧ → ⟦,⟧ᴬ, L');
  T(s3toE, [ESTART], null, 'L', s3toV, '⟦(ᴱ⟧ → L'); Tother(s3toE, 'L', s3toE);
  const c3 = compare('c3', 'L', {
    match:{write:setMark(''), move:'L', to:s3rt, rule:'δᴮ → δ, L'},
    mismatch:{write:setMark('T'), move:'R', to:s3cand, rule:'δᴮ → δᵀ, R'}});
  T(s3toV, ['('], '(B', 'R', c3, '⟦(⟧ → ⟦(⟧ᴮ, R'); Tother(s3toV, 'L', s3toV);
  T(s3cand, DIG, null, 'R', s3cand, 'd → R'); T(s3cand, [','], ',B', 'R', c3, '⟦,⟧ → ⟦,⟧ᴮ, R');
  T(s3rt, [',T'], ',', 'L', s3rt, '⟦,⟧ᵀ → ⟦,⟧, L'); T(s3rt, [...DIG, ','], null, 'L', s3rt, 'd ⟦,⟧ → L');
  T(s3rt, ['(T'], '(', 'R', s3toA, '⟦(⟧ᵀ → ⟦(⟧, R'); T(s3rt, ['('], null, 'R', s3toA, '⟦(⟧ → R');
  T(s3toA, A_, setMark('D'), 'R', s3findX, 'δᴬ → δᴰ, R'); Tother(s3toA, 'R', s3toA);
  // ======================= Stage 4: P lists every vertex exactly once =======================
  region = 4;
  const s4goP = S('s4goP', 'to P', 'Walking right to the start of P.');
  const s4findP = S('s4findP', 'next in P', 'Finding the next vertex of P that hasn’t been looked up yet.');
  const s4toE = S('s4toE', 'back to E', 'Walking left past E.');
  const s4toV = S('s4toV', 'to V start', 'Walking left to the first vertex of V.');
  const s4cand = S('s4cand', 'next unused', 'Trying the next vertex of V that P hasn’t used yet.');
  const s4rt = S('s4rt', 'clear tried', 'Found it. Clearing the T marks in V.');
  const s4toA = S('s4toA', 'mark done', 'Walking back to P to mark this vertex D.');
  const s4cE = S('s4cE', 'back to E', 'All of P is looked up. Walking left past E.');
  const s4cV = S('s4cV', 'all used?', 'Checking that every vertex of V got marked D (used by P).');
  T(s3clr, D_, setMark(''), 'L', s3clr, 'δᴰ → δ, L'); T(s3clr, [ESTART], null, 'R', e2findI, '⟦(ᴱ⟧ → R'); Tother(s3clr, 'L', s3clr);
  // ---- no edge listed twice: compare each edge (a,b) with every later edge (c,d); a = c and b = d rejects ----
  region = 3;
  T(e2findI, [...DIG, ',', ')', '(D'], null, 'R', e2findI, 'd ⟦,⟧ ⟦)⟧ ⟦(⟧ᴰ → R');
  T(e2findI, ['('], '(A', 'R', e2findJ, '⟦(⟧ → ⟦(⟧ᴬ, R');
  T(e2findI, ['#'], null, 'L', e2clr, '⟦#⟧ → L');
  const c6a = compare('c6a', 'R', {
    match:{write:'(T', move:'R', to:e2commaJ, rule:'⟦(⟧ᴮ → ⟦(⟧ᵀ, R'},
    mismatch:{write:'(T', move:'R', to:e2findJ, rule:'⟦(⟧ᴮ → ⟦(⟧ᵀ, R'}});
  T(e2findJ, [...DIG, ',', ')', '(T'], null, 'R', e2findJ, 'd ⟦,⟧ ⟦)⟧ ⟦(⟧ᵀ → R');
  T(e2findJ, ['('], '(B', 'L', c6a, '⟦(⟧ → ⟦(⟧ᴮ, L');
  T(e2findJ, ['#'], null, 'L', e2resetT, '⟦#⟧ → L');

  T(e2toI, ['(A'], CUR, 'R', e2commaI, '⟦(⟧ᴬ → ⟦(ᶜ⟧, R'); Tother(e2toI, 'L', e2toI);
  T(e2commaI, DIG, null, 'R', e2commaI, 'd → R');
  const c6b = compare('c6b', 'R', {match:null, mismatch:{write:',', move:'L', to:e2backI, rule:'⟦,⟧ᴮ → ⟦,⟧, L'}});
  T(e2commaI, [','], ',A', 'R', c6b, '⟦,⟧ → ⟦,⟧ᴬ, R');
  T(e2backI, [',A'], ',', 'L', e2backI, '⟦,⟧ᴬ → ⟦,⟧, L'); T(e2backI, [CUR], '(A', 'R', e2findJ, '⟦(ᶜ⟧ → ⟦(⟧ᴬ, R'); Tother(e2backI, 'L', e2backI);
  T(e2resetT, ['(T'], '(', 'L', e2resetT, '⟦(⟧ᵀ → ⟦(⟧, L'); T(e2resetT, ['(A'], '(D', 'R', e2findI, '⟦(⟧ᴬ → ⟦(⟧ᴰ, R'); Tother(e2resetT, 'L', e2resetT);
  T(e2clr, ['(D'], '(', 'L', e2clr, '⟦(⟧ᴰ → ⟦(⟧, L'); T(e2clr, [ESTART], null, 'R', s4goP, '⟦(ᴱ⟧ → R'); Tother(e2clr, 'L', e2clr);
  region = 4;
  T(s4goP, ['#'], null, 'R', s4findP, '⟦#⟧ → R'); Tother(s4goP, 'R', s4goP);
  T(s4findP, [...DIG, ...D_], null, 'R', s4findP, 'd δᴰ → R');
  T(s4findP, PLAIN, setMark('A'), 'L', s4toE, 'δ → δᴬ, L');
  T(s4findP, [')'], null, 'L', s4cE, '⟦)⟧ → L');
  T(s4toE, [ESTART], null, 'L', s4toV, '⟦(ᴱ⟧ → L'); Tother(s4toE, 'L', s4toE);
  const c4 = compare('c4', 'L', {
    match:{write:setMark('D'), move:'L', to:s4rt, rule:'δᴮ → δᴰ, L'},
    mismatch:{write:setMark('T'), move:'R', to:s4cand, rule:'δᴮ → δᵀ, R'}});
  T(s4toV, ['('], '(B', 'R', c4, '⟦(⟧ → ⟦(⟧ᴮ, R'); T(s4toV, ['(D'], null, 'R', s4cand, '⟦(⟧ᴰ → R'); Tother(s4toV, 'L', s4toV);
  T(s4cand, [...DIG, ',D', ',T'], null, 'R', s4cand, 'd ⟦,⟧ᴰ ⟦,⟧ᵀ → R'); T(s4cand, [','], ',B', 'R', c4, '⟦,⟧ → ⟦,⟧ᴮ, R');
  T(s4rt, [',T'], ',', 'L', s4rt, '⟦,⟧ᵀ → ⟦,⟧, L'); T(s4rt, [...DIG, ',', ',D'], null, 'L', s4rt, 'd ⟦,⟧ ⟦,⟧ᴰ → L');
  T(s4rt, ['(T'], '(', 'R', s4toA, '⟦(⟧ᵀ → ⟦(⟧, R'); T(s4rt, ['(', '(D'], null, 'R', s4toA, '⟦(⟧ ⟦(⟧ᴰ → R');
  T(s4toA, A_, setMark('D'), 'R', s4findP, 'δᴬ → δᴰ, R'); Tother(s4toA, 'R', s4toA);
  T(s4cE, [ESTART], null, 'L', s4cV, '⟦(ᴱ⟧ → L'); Tother(s4cE, 'L', s4cE);
  // ======================= Stage 5: consecutive pairs are edges =======================
  region = 5;
  const s5goH = S('s5goH', 'to P', 'Walking right to P.');
  const s5clrP = S('s5clrP', 'clear P', 'Clearing the D marks from P.');
  const s5back = S('s5back', 'back to #', 'Walking back to the start of P.');
  const s5findI = S('s5findI', 'next pair', 'Finding the first vertex of P whose step hasn’t been checked. It gets an A mark.');
  const s5next = S('s5next', 'last vertex?', 'Is there a next vertex after this one? If not, every step was an edge.');
  const s5toE = S('s5toE', 'to E start', 'Walking left to the start of E.');
  const s5edge = S('s5edge', 'next edge', 'Finding the next edge of E that hasn’t been tried for this step.');

//  marks on the tape -> what the machine is doing to the graph

function firstVertex(label){ return enc.V.findIndex(v=>v.label===label); }

const gSvg = $('graphSvg');

    else if(c.why==='badEnd'){ v.ecls[c.edge] = 'ebad'; v.ghost[c.label] = 'vbad'; }

function narrate(i){

  const box = $('narr'), ctx = $('narrCtx'), doing = $('narrDo');
  box.className = 'narr';
  if(!T){
    box.classList.add('idle');
    ctx.innerHTML = enc && encIn.value!=='' ? 'Press <b>Lock in</b>, then <b>Play</b>, to run the machine on this input.' : 'Type an encoding above.';
    doing.innerHTML = `The head starts on cell 0 in ${qName(L.nodes[nodeOf(M.start)].name)}.`;
    return;
  }
  const q = T.qs[i], st = M.states[q];
  if(i===T.last){
    const c = enc.ok ? HP.check(enc) : null;
    if(T.verdict.type==='accept'){ box.classList.add('accept'); ctx.innerHTML = '<b>Accept.</b> P is a path in G that visits every vertex exactly once.'; doing.textContent = `Halted in q_acc after ${T.last.toLocaleString()} steps.`; return; }

    else if(c.why==='badEnd') why = `Edge (${esc(enc.E[c.edge].a)},${esc(enc.E[c.edge].b)}) uses ${esc(c.label)}, which isn’t a vertex in V.`;
    else if(c.why==='notInV') why = `The ${ord(c.idx+1)} vertex of P, ${esc(c.label)}, isn’t a vertex in V.`;
    else if(c.why==='repeat') why = `P visits ${esc(c.label)} twice.`;
    else if(c.why==='missing') why = `P never visits vertex ${esc(c.label)}.`;
    else if(c.why==='noEdge') why = `G has no edge (${esc(c.a)},${esc(c.b)}), so P can’t step from ${esc(c.a)} to ${esc(c.b)}.`;
    ctx.innerHTML = `<b>Reject.</b> ${why}`;
    doing.innerHTML = `${qName(from)} has no arrow for <span class="s">${esc(read)}</span>, so the machine went to ${qName('q_rej')} after ${T.last.toLocaleString()} steps.`;
    return;
  }

      else c = 'Checking that every edge goes between vertices in V.';
    } else if(r===4){
      const k = m.p.indexOf('A');

function updateButtons(){
  const ok = !!T, atEnd = !ok || idx>=T.last, atStart = !ok || idx===0;
  $('playBtn').textContent = playing ? '❚❚ Pause' : (ok && atEnd ? '↻ Replay' : '▶ Play');
  $('playBtn').disabled = !ok;
  $('resetBtn').disabled = atStart; $('endBtn').disabled = atEnd;
}

// ======================================================================
//  player
// ======================================================================
function go(i, animate){ if(!T) return; idx = Math.max(0, Math.min(T.last, i)); render(animate); }
function step(n){ if(!T || idx>=T.last) return false; go(idx+n, n===1); return true; }
let lastFrame = 0, owed = 0;
function startPlay(){ if(!T) return; if(idx>=T.last) go(0, false); playing = true; owed = 1; lastFrame = performance.now(); updateButtons(); playTimer = requestAnimationFrame(frame); }
function frame(now){
  if(!playing) return;
  owed += Math.min(250, now - lastFrame) * SPEEDS[speed][1] / 1000; lastFrame = now;
  const n = Math.floor(owed);
  if(n > 0){ owed -= n; go(idx + n, n === 1 && gentle()); }
  if(idx >= T.last){ stopPlay(); return; }
  playTimer = requestAnimationFrame(frame);
}
function stopPlay(){ playing = false; cancelAnimationFrame(playTimer); updateButtons(); }
function togglePlay(){ playing ? stopPlay() : startPlay(); }
$('playBtn').addEventListener('click', togglePlay);
$('resetBtn').addEventListener('click', ()=>{ stopPlay(); go(0,false); });
$('endBtn').addEventListener('click', ()=>{ stopPlay(); go(T.last,false); });
document.addEventListener('keydown', e=>{
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='input' || tag==='textarea' || tag==='select' || !T) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key===' ' && tag!=='button' && !e.target.closest('.stage')){ e.preventDefault(); togglePlay(); }
  else if(e.key==='r' || e.key==='R'){ stopPlay(); go(0,false); }
});

// ======================================================================
//  input, lock in, edit
// ======================================================================
function inputChanged(){
  const raw = encIn.value, clean = raw.replace(/\s+/g,'');
  if(clean!==raw){ const p = encIn.selectionStart; encIn.value = clean; try{ encIn.setSelectionRange(p-(raw.length-clean.length), p-(raw.length-clean.length)); }catch(e){} }
  const bad = [...new Set(Array.from(encIn.value).filter(c=>!SIGMA.has(c)))];
  const msg = $('encMsg');
  if(bad.length){
    enc = null; encIn.classList.add('bad');
    msg.className = 'msg err'; msg.textContent = `${bad.map(c=>`“${c}”`).join(', ')} ${bad.length===1?'isn’t':'aren’t'} in Σ. The machine only reads the symbols listed above.`;
    $('lockBtn').disabled = true;
  } else {
    encIn.classList.remove('bad'); $('lockBtn').disabled = false;
    enc = HP.parse(encIn.value);
    if(encIn.value===''){ msg.className = 'msg ok'; msg.textContent = 'The machine will reject the empty string, since it isn’t an encoding.'; }
    else if(!enc.ok){ msg.className = 'msg err'; msg.textContent = `Not a valid encoding: ${enc.error}`; }
    else {
      // well formed, but still not an encoding of a graph and a list of its vertices
      const c = HP.check(enc), why = c.ok || c.stage > 3 ? '' :
        c.why==='dupV' ? `vertex ${c.label} is listed twice.` :
        c.why==='badEnd' ? `edge (${enc.E[c.edge].a},${enc.E[c.edge].b}) uses ${c.label}, which isn’t a vertex of G.` :
        c.why==='notInV' ? `P uses ${c.label}, which isn’t a vertex of G.` :
        c.why==='dupE' ? `edge (${c.a},${c.b}) is listed twice.` : '';
      msg.className = why ? 'msg err' : 'msg ok'; msg.textContent = why ? 'Not a valid encoding: ' + why : '';
    }
  }
  fit(encIn); renderBands(); render(false);
}
encIn.addEventListener('input', ()=>{ if(!locked) inputChanged(); });
encIn.addEventListener('keydown', e=>{ if(e.key==='Enter' && !$('lockBtn').disabled){ e.preventDefault(); lock(); } });
function lock(){
  if(locked) return;
  T = HP.run(M, encIn.value);
  regs = new Int8Array(T.last+1);
  for(let i=0;i<=T.last;i++){ const q = T.qs[i]; regs[i] = q==='qrej' ? M.states[T.verdict.from].region : q==='qacc' ? 6 : M.states[q].region; }
  locked = true; idx = 0;
  encIn.readOnly = true; $('inputPanel').classList.add('is-locked'); $('lockBtn').hidden = true; $('editBtn').hidden = false;
  render(false);
}
function unlock(){
  stopPlay(); locked = false; T = null; regs = null; idx = 0;
  encIn.readOnly = false; $('inputPanel').classList.remove('is-locked'); $('lockBtn').hidden = false; $('editBtn').hidden = true;
  $('lockNote').textContent = '';
  render(false);
}
$('lockBtn').addEventListener('click', lock);
$('editBtn').addEventListener('click', ()=>{ unlock(); encIn.focus(); });
let resizeTimer = null;
window.addEventListener('resize', ()=>{ clearTimeout(resizeTimer); resizeTimer = setTimeout(()=>{ cellCache = 0; fit(encIn); applyScale(); renderBands(); render(false); }, 120); });

// boot with the example from the notes
encIn.value = EXAMPLES.valid;
inputChanged();
follow(true);
})();

</script>
