<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- an R drawn as a simple path (straight edges, no crossings) through seven points;
       each edge takes the colour of the point it leaves -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7" fill="#ffffff" stroke="#a9cbe4" stroke-width="1.5"/>
  <g stroke-width="1.9" stroke-linecap="round">
    <line x1="8" y1="27" x2="8" y2="5" stroke="#d1495b"/>
    <line x1="8" y1="5" x2="19" y2="5" stroke="#e0861b"/>
    <line x1="19" y1="5" x2="24.5" y2="10.5" stroke="#c9a227"/>
    <line x1="24.5" y1="10.5" x2="19" y2="16" stroke="#4caf50"/>
    <line x1="19" y1="16" x2="11.5" y2="16" stroke="#1f9e9a"/>
    <line x1="11.5" y1="16" x2="24.5" y2="27" stroke="#2f6fd0"/>
  </g>
  <g stroke="#16324f" stroke-width="0.9">
    <circle cx="8" cy="27" r="2" fill="#d1495b"/>
    <circle cx="8" cy="5" r="2" fill="#e0861b"/>
    <circle cx="19" cy="5" r="2" fill="#c9a227"/>
    <circle cx="24.5" cy="10.5" r="2" fill="#4caf50"/>
    <circle cx="19" cy="16" r="2" fill="#1f9e9a"/>
    <circle cx="11.5" cy="16" r="2" fill="#2f6fd0"/>
    <circle cx="24.5" cy="27" r="2" fill="#7b4fc9"/>
  </g>
</svg>
