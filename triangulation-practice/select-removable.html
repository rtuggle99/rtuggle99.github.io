<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/delaunator@5.1.0/delaunator.min.js"></script>
<title>Select the Removable Triangles</title>
<style>
  :root{
    --paper:#eaf4fb;
    --ink:#16324f;
    --rule:#a9cbe4;
    --info:#2f6690;
    --info-soft:#d7ebf7;
    --danger:#a8384a;
    --danger-soft:#f6dde1;
    --good:#1f5c38;
    --good-soft:#dcf0e2;
    --neutral:#c9d9e6;
    --serif: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
  }
  *{box-sizing:border-box;}
  /* rapid clicks on the board or buttons shouldn't start a text selection
     that spills onto nearby labels, scores, and status text */
  button, svg{ user-select:none; -webkit-user-select:none; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.5;
    padding:32px 18px 80px;
  }
  .page{ max-width:820px; margin:0 auto; }
  h1{
    font-family:var(--serif);
    font-size:1.55rem;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0 0 4px;
    border-bottom:3px solid var(--ink);
    padding-bottom:10px;
  }
  .subtitle{ font-size:0.92rem; color:#3d5a75; font-style:italic; margin:0 0 22px; }
  .note{
    font-size:0.88rem;
    background:var(--info-soft);
    border-left:3px solid var(--info);
    padding:12px 14px;
    margin-bottom:20px;
  }
  .note p{margin:0 0 8px;}
  .note p:last-child{margin-bottom:0;}
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:0.82rem; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .swatch{ width:13px; height:13px; border-radius:2px; border:1px solid var(--ink); display:inline-block; }
  .board{
    background:#fff;
    border:1.5px solid var(--ink);
    border-radius:4px;
    padding:14px;
    margin-bottom:16px;
  }
  svg{ display:block; width:100%; height:auto; background:#f5fafd; border-radius:3px; }
  .tri-poly{ cursor:pointer; transition:fill 0.1s; }
  .tri-label{ font-family:var(--serif); font-weight:700; font-size:15px; fill:var(--ink); pointer-events:none; user-select:none; }
  .controls{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  button{
    font-family:var(--serif); font-size:0.98rem; background:#f5fafd;
    border:1.5px solid var(--ink); border-radius:3px; padding:9px 18px; cursor:pointer; color:var(--ink);
  }
  button:disabled{ opacity:0.4; cursor:default; }
  button.primary{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .spacer{ flex:1 1 auto; }
  .hint{ font-size:0.82rem; color:#3d5a75; margin-bottom:14px; }
  .score{ font-size:0.85rem; color:#3d5a75; text-align:right; margin-bottom:4px; }
  .feedback{
    font-size:0.94rem; border-radius:4px; padding:14px 16px; margin-bottom:18px; display:none;
  }
  .feedback.show{ display:block; }
  .feedback.correct{ background:var(--good-soft); border-left:3px solid var(--good); }
  .feedback.incorrect{ background:var(--danger-soft); border-left:3px solid var(--danger); }
  .feedback .verdict{ font-weight:700; margin-bottom:4px; }
  .review-panel{
    background:#fff; border:1.5px solid var(--ink); border-radius:4px; padding:4px 14px; margin-bottom:16px;
  }
  .review-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 4px; border-bottom:1px solid var(--rule); cursor:pointer;
  }
  .review-item:last-child{ border-bottom:none; }
  .review-right{ display:flex; align-items:center; gap:10px; }
  .review-chevron{ color:#3d5a75; font-size:0.9rem; }
  .review-x{ color:var(--danger); font-weight:700; }
  @media (hover: hover) {
    button:hover:not(:disabled){ background:var(--info-soft); border-color:var(--info); }
    button.primary:hover:not(:disabled){ background:var(--info); border-color:var(--info); }
    .review-item:hover{ background:var(--info-soft); }
  }
</style>
</head>
<body>
<div class="page">
  <h1>Select the Removable Triangles</h1>
  <p class="subtitle">Practice recognizing which triangles can be taken out and still leave a valid partial triangulation.</p>

  <div class="note">
    <p>Select every <b>removable</b> triangle: taking it out still leaves a
      valid partial triangulation.</p>
    <div class="legend">
      <span><i class="swatch" style="background:#4fb08a"></i>removable</span>
      <span><i class="swatch" style="background:var(--neutral)"></i>not removable</span>
    </div>
  </div>

  <div class="board" id="boardSection">
    <svg id="canvas" viewBox="0 0 700 700"></svg>
  </div>

  <div class="controls" id="controlsSection">
    <div class="spacer"></div>
    <button class="primary" id="btnLock" onclick="lockIn()">Submit</button>
    <button id="btnNext" onclick="nextRound()" style="display:none;">Next</button>
  </div>


  <div class="score" id="score">0 / 0 triangles correct</div>
  <div class="feedback" id="feedback"></div>

  <div id="bottomActions" style="margin-bottom:14px;">
    <button id="btnReview" onclick="showReviewList()" style="display:none;">Review past rounds</button>
    <button id="btnBackToList" onclick="backToList()" style="display:none;">Back to list</button>
  </div>

  <div id="reviewListPanel" style="display:none;">
    <div class="review-panel" id="reviewListItems"></div>
    <button onclick="backToPractice()">Back to practice</button>
  </div>
</div>

<script>
// A double or triple click (or a fast run of clicks) on the board or a
// button makes the browser start a text selection and snap it to the
// nearest text, highlighting scores, status lines, or button labels.
// Cancel that multi-click selection everywhere except the explanatory
// note; single clicks, drags, and text selection inside the note are
// unaffected.
document.addEventListener("mousedown", (e) => {
  if (e.detail > 1 && !e.target.closest(".note")) e.preventDefault();
});
// ============================================================
// geometry (reused and verified against the earlier two sites)
// ============================================================
function cross(o, a, b) { return (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x); }
function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }
function randRange(a, b) { return a + Math.random() * (b - a); }
function randInt(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function convexHull(points) {
  const pts = [...points].sort((a, b) => a.x - b.x || a.y - b.y);
  const n = pts.length;
  if (n < 3) return pts;
  const lower = [];
  for (const p of pts) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
    lower.push(p);
  }
  const upper = [];
  for (let i = n - 1; i >= 0; i--) {
    const p = pts[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
    upper.push(p);
  }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}
function pointInConvexPolygon(p, poly) {
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    if (cross(a, b, p) <= 1e-9) return false;
  }
  return true;
}
function collinear(a, b, c, eps = 1e-7) { return Math.abs(cross(a, b, c)) < eps; }
function anyThreeCollinear(points, eps = 1e-7) {
  for (let i = 0; i < points.length; i++)
    for (let j = i + 1; j < points.length; j++)
      for (let k = j + 1; k < points.length; k++)
        if (collinear(points[i], points[j], points[k], eps)) return true;
  return false;
}
function generatePointSet() {
  for (let attempt = 0; attempt < 200; attempt++) {
    const hullSize = randInt(4, 7);
    const interiorCount = randInt(2, 6);
    let angles = [];
    for (let i = 0; i < hullSize; i++) angles.push(Math.random() * 2 * Math.PI);
    angles.sort((a, b) => a - b);
    let ok = true;
    for (let i = 0; i < hullSize; i++) {
      const a1 = angles[i], a2 = angles[(i + 1) % hullSize];
      const gap = (i === hullSize - 1) ? (a1 - a2 + 2 * Math.PI) : (a2 - a1);
      if (gap < 0.3) { ok = false; break; }
    }
    if (!ok) continue;
    const R = 260;
    const hullPts = angles.map(a => ({
      x: 350 + Math.cos(a) * R * randRange(0.85, 1.0),
      y: 350 + Math.sin(a) * R * randRange(0.85, 1.0),
    }));
    const hull = convexHull(hullPts);
    if (hull.length !== hullSize) continue;
    const interior = [];
    let interiorOk = true;
    for (let i = 0; i < interiorCount; i++) {
      let placed = false;
      for (let tries = 0; tries < 200; tries++) {
        const cand = { x: randRange(210, 490), y: randRange(210, 490) };
        if (pointInConvexPolygon(cand, hull) && !interior.some(q => dist2(q, cand) < 35 * 35)) {
          interior.push(cand); placed = true; break;
        }
      }
      if (!placed) { interiorOk = false; break; }
    }
    if (!interiorOk) continue;
    const all = hull.concat(interior);
    if (anyThreeCollinear(all)) continue;
    // reject point sets whose full triangulation contains a sliver
    // triangle too small to comfortably tap; collinearity alone isn't
    // enough to rule this out, near-collinear points still produce one
    const fullTriangulation = delaunay(all);
    const minArea = Math.min(...fullTriangulation.map(t => Math.abs(cross(t[0], t[1], t[2])) / 2));
    if (minArea < 200) continue;
    // area alone doesn't rule out a thin dart shape: a triangle can be
    // large in area while still being highly elongated. This checks
    // shape quality directly (area relative to the square of the
    // longest edge, scale-invariant, ~0.43 for equilateral, near 0 for
    // a sliver), independent of the area check above
    const minQuality = Math.min(...fullTriangulation.map(t => {
      const e2 = [dist2(t[0], t[1]), dist2(t[1], t[2]), dist2(t[2], t[0])];
      return (Math.abs(cross(t[0], t[1], t[2])) / 2) / Math.max(...e2);
    }));
    if (minQuality < 0.05) continue;
    return { hull, interior, all };
  }
  throw new Error("failed to generate a point set");
}
function delaunay(points) {
  if (points.length < 3) return [];
  const coords = new Float64Array(points.length * 2);
  points.forEach((p, i) => { coords[2 * i] = p.x; coords[2 * i + 1] = p.y; });
  const d = new Delaunator(coords);
  const triangles = [];
  for (let i = 0; i < d.triangles.length; i += 3) {
    triangles.push([points[d.triangles[i]], points[d.triangles[i + 1]], points[d.triangles[i + 2]]]);
  }
  return triangles;
}
function edgeKeyOf(a, b, idxOf) {
  const ia = idxOf.get(a), ib = idxOf.get(b);
  return ia < ib ? `${ia}_${ib}` : `${ib}_${ia}`;
}
function buildEdgeInfo(triangles, allPoints) {
  const idxOf = new Map(allPoints.map((p, i) => [p, i]));
  const edgeUse = new Map();
  triangles.forEach((t, ti) => {
    for (const [u, v] of [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]]) {
      const k = edgeKeyOf(u, v, idxOf);
      if (!edgeUse.has(k)) edgeUse.set(k, []);
      edgeUse.get(k).push(ti);
    }
  });
  return { idxOf, edgeUse };
}
function boundaryEdgeCount(tri, idxOf, edgeUse) {
  let count = 0;
  for (const [u, v] of [[tri[0], tri[1]], [tri[1], tri[2]], [tri[2], tri[0]]]) {
    const info = edgeUse.get(edgeKeyOf(u, v, idxOf));
    if (info && info.length === 1) count++;
  }
  return count;
}
function boundaryVertexSet(idxOf, edgeUse) {
  const s = new Set();
  for (const [key, tris] of edgeUse) {
    if (tris.length !== 1) continue;
    const [a, b] = key.split("_").map(Number);
    s.add(a); s.add(b);
  }
  return s;
}
function findRemovableTriangles(triangles, allPoints) {
  const { idxOf, edgeUse } = buildEdgeInfo(triangles, allPoints);
  const bvs = boundaryVertexSet(idxOf, edgeUse);
  const removable = [];
  for (const t of triangles) {
    const bec = boundaryEdgeCount(t, idxOf, edgeUse);
    // isolated (T={t}) is never removable: removing the last triangle
    // leaves the empty set, and a partial triangulated surface is
    // defined as a NONEMPTY set of triangles, so this doesn't qualify
    if (bec === 2) { removable.push(t); continue; }
    if (bec === 1) {
      const edges = [[t[0], t[1]], [t[1], t[2]], [t[2], t[0]]];
      const boundaryEdge = edges.find(([u, v]) => edgeUse.get(edgeKeyOf(u, v, idxOf)).length === 1);
      const opp = t.find(v => !boundaryEdge.includes(v));
      if (!bvs.has(idxOf.get(opp))) removable.push(t);
    }
  }
  return removable;
}
function generateRound() {
  const { all } = generatePointSet();
  let triangles = delaunay(all);
  const totalT = triangles.length;
  const removeFraction = randRange(0, 1.0);
  const targetRemovals = Math.round(removeFraction * (totalT - 1));
  for (let i = 0; i < targetRemovals; i++) {
    const removable = findRemovableTriangles(triangles, all);
    if (removable.length === 0) break;
    const victim = pick(removable);
    triangles = triangles.filter(t => t !== victim);
  }
  const trueRemovable = findRemovableTriangles(triangles, all);
  const trueRemovableSet = new Set(trueRemovable);
  const isRemovable = triangles.map(t => trueRemovableSet.has(t));
  return { triangles, allPoints: all, isRemovable };
}

// ============================================================
// round state + UI
// ============================================================
let round = null;
let selected = []; // boolean per triangle
let locked = false;
let scoreRight = 0, scoreTotal = 0;
let history = [];

function triCentroid(t) { return { x: (t[0].x+t[1].x+t[2].x)/3, y: (t[0].y+t[1].y+t[2].y)/3 }; }

function drawBoard(triangles, allPoints, selected, clickable) {
  const svg = document.getElementById("canvas");
  svg.innerHTML = "";
  const ns = "http://www.w3.org/2000/svg";
  triangles.forEach((t, i) => {
    const poly = document.createElementNS(ns, "polygon");
    poly.setAttribute("points", t.map(p => `${p.x},${p.y}`).join(" "));
    poly.setAttribute("class", "tri-poly");
    poly.setAttribute("fill", selected[i] ? "#4fb08a" : "#c9d9e6");
    poly.setAttribute("stroke", "#16324f");
    poly.setAttribute("stroke-width", "1.5");
    poly.setAttribute("data-idx", i);
    if (clickable) poly.addEventListener("click", () => onTriClick(i));
    svg.appendChild(poly);
  });
  triangles.forEach((t, i) => {
    const c = triCentroid(t);
    const label = document.createElementNS(ns, "text");
    label.setAttribute("x", c.x);
    label.setAttribute("y", c.y);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("dominant-baseline", "central");
    label.setAttribute("class", "tri-label");
    label.textContent = "";
    label.style.pointerEvents = "none";
    svg.appendChild(label);
  });
  for (const p of allPoints) {
    const c = document.createElementNS(ns, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 3.5);
    c.setAttribute("fill", "#16324f");
    svg.appendChild(c);
  }
}

function render() {
  drawBoard(round.triangles, round.allPoints, selected, true);
}

// Builds the full "already submitted" appearance from stored data alone
// (truth-revealing fill, wrong-answer X marks), so this same function
// renders either the just-submitted live round or a past round pulled
// from history. Never clickable.
function drawSubmittedBoard(triangles, allPoints, selected, isRemovable) {
  drawBoard(triangles, allPoints, selected, false);
  const svg = document.getElementById("canvas");
  const polys = svg.querySelectorAll(".tri-poly");
  const labels = svg.querySelectorAll(".tri-label");
  triangles.forEach((t, i) => {
    const correct = selected[i] === isRemovable[i];
    polys[i].setAttribute("fill", isRemovable[i] ? "#4fb08a" : "#c9d9e6");
    labels[i].textContent = correct ? "" : "\u2717";
    labels[i].style.fill = "#16324f";
    labels[i].style.stroke = "#fff";
    labels[i].style.strokeWidth = "3px";
    labels[i].style.paintOrder = "stroke";
  });
}

function onTriClick(i) {
  if (locked) return;
  selected[i] = !selected[i];
  render();
}

function lockIn() {
  if (locked) return;
  locked = true;
  let roundRight = 0;
  round.triangles.forEach((t, i) => {
    scoreTotal++;
    if (selected[i] === round.isRemovable[i]) { scoreRight++; roundRight++; }
  });
  document.getElementById("score").textContent = `${scoreRight} / ${scoreTotal} triangles correct`;

  drawSubmittedBoard(round.triangles, round.allPoints, selected, round.isRemovable);

  const allCorrect = roundRight === round.triangles.length;
  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (allCorrect ? "correct" : "incorrect");
  fb.innerHTML = `<div class="verdict">${roundRight} / ${round.triangles.length} correct this round.</div>` +
    (allCorrect ? "" : "<div>Colors now show the true answer. An \u2717 marks a wrong guess.</div>");

  history.push({ round, selected: [...selected], correct: allCorrect, feedbackHTML: fb.innerHTML, feedbackClass: fb.className });
  document.getElementById("btnReview").style.display = "inline-block";

  document.getElementById("btnLock").style.display = "none";
  document.getElementById("btnNext").style.display = "inline-block";
}

function showReviewList() {
  document.getElementById("boardSection").style.display = "none";
  document.getElementById("controlsSection").style.display = "none";
  document.getElementById("score").style.display = "none";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("btnReview").style.display = "none";
  document.getElementById("btnBackToList").style.display = "none";
  document.getElementById("reviewListPanel").style.display = "block";
  const itemsDiv = document.getElementById("reviewListItems");
  itemsDiv.innerHTML = history.map((h, i) =>
    `<div class="review-item" onclick="showReviewDetail(${i})">
       <span>Round ${i + 1}</span>
       <span class="review-right">
         ${h.correct ? "" : '<span class="review-x">\u2717</span>'}
         <span class="review-chevron">\u203a</span>
       </span>
     </div>`
  ).join("");
}

function showReviewDetail(i) {
  const h = history[i];
  document.getElementById("reviewListPanel").style.display = "none";
  document.getElementById("boardSection").style.display = "block";
  document.getElementById("btnBackToList").style.display = "inline-block";
  drawSubmittedBoard(h.round.triangles, h.round.allPoints, h.selected, h.round.isRemovable);
  const fb = document.getElementById("feedback");
  fb.className = h.feedbackClass;
  fb.innerHTML = h.feedbackHTML;
}

function backToList() {
  document.getElementById("boardSection").style.display = "none";
  document.getElementById("btnBackToList").style.display = "none";
  document.getElementById("feedback").className = "feedback";
  showReviewList();
}

function backToPractice() {
  document.getElementById("reviewListPanel").style.display = "none";
  document.getElementById("boardSection").style.display = "block";
  document.getElementById("controlsSection").style.display = "flex";
  document.getElementById("score").style.display = "block";
  document.getElementById("btnReview").style.display = history.length ? "inline-block" : "none";
  document.getElementById("btnBackToList").style.display = "none";
  if (locked) {
    const last = history[history.length - 1];
    drawSubmittedBoard(round.triangles, round.allPoints, selected, round.isRemovable);
    const fb = document.getElementById("feedback");
    fb.className = last.feedbackClass;
    fb.innerHTML = last.feedbackHTML;
  } else {
    render();
    document.getElementById("feedback").className = "feedback";
  }
}

function nextRound() {
  round = generateRound();
  selected = round.triangles.map(() => false);
  locked = false;
  document.getElementById("btnLock").disabled = false;
  document.getElementById("btnLock").style.display = "inline-block";
  document.getElementById("btnNext").style.display = "none";
  document.getElementById("feedback").className = "feedback";
  render();
}

window.addEventListener("load", nextRound);
</script>
</body>
</html>
